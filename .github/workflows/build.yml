# Builds the Android app (Gradle-free script, same as local builds) and checks the JavaScript on every push / PR.
# The APK is uploaded as a workflow artifact. It is signed with the runner's throwaway debug key unless the
# repository secrets LYRICDOCK_KEYSTORE_B64 / LYRICDOCK_KS_PASS / LYRICDOCK_KEY_ALIAS hold a release key.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check the JavaScript
        shell: pwsh
        run: |
          Get-ChildItem extension/*.js, android/app/src/main/assets/*.js, helper/src/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE) { throw "syntax error in $($_.Name)" }
          }

      - name: Android SDK platform 34
        shell: pwsh
        run: |
          $sdkm = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          'y' * 10 | & $sdkm.FullName "platforms;android-34" "build-tools;34.0.0" | Out-Null

      - name: Release key (if configured)
        shell: pwsh
        env:
          KS_B64: ${{ secrets.LYRICDOCK_KEYSTORE_B64 }}
        run: |
          if ($env:KS_B64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release.jks", [Convert]::FromBase64String($env:KS_B64))
            "LYRICDOCK_KEYSTORE=$env:RUNNER_TEMP\release.jks" | Out-File $env:GITHUB_ENV -Append
          }

      - name: Build APK
        shell: pwsh
        env:
          LYRICDOCK_KS_PASS: ${{ secrets.LYRICDOCK_KS_PASS }}
          LYRICDOCK_KEY_ALIAS: ${{ secrets.LYRICDOCK_KEY_ALIAS }}
        run: ./scripts/build-apk.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: lyricdock-apk
          path: android/build/lite/lyricdock.apk
          if-no-files-found: error
