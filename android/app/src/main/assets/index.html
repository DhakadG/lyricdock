<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body class="paused">
<canvas id="bgc"></canvas><div id="bg"></div><div id="bgGrad"></div><div id="dim"></div>
<div id="wrap">
  <div id="left">
    <div id="artbox">
      <div id="art">
        <div id="pulse"><div><svg viewBox="0 0 24 24"><path id="pulseIcon"/></svg></div></div>
        <div id="ripple"></div>
        <div id="ctl">
          <button id="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button id="pp"><svg viewBox="0 0 24 24"><path id="ppIcon"/></svg></button>
          <button id="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
          <input id="vol" type="range" min="0" max="100" step="1" aria-label="Volume">
        </div>
      </div>
    </div>
    <div id="meta"><div id="titlerow"><div id="title">Waiting for Spotify…</div><button id="heart" aria-label="Like"><svg viewBox="0 0 24 24"><path class="fill" fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg></button></div><div id="artist"></div><div id="quality"></div></div>
  </div>
  <div id="lyrics"><div id="lines"></div></div>
</div>
<div id="bar"><div id="fill"></div></div>
<div id="times"><span id="tcur"></span><span id="tdur"></span></div>
<button id="gear"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
<div id="dot">Reconnecting…</div>
<div id="toast"></div>
<div id="pairAsk"><div class="pa-card"><div class="pa-title">Connect <b id="pairName"></b>?</div><div class="pa-sub">Allow only if Spotify on your computer shows the same code:</div><div id="pairDigits" class="pa-digits"></div><div class="pa-btns"><button id="pairDeny">Deny</button><button id="pairAllow" class="pa-ok">Allow</button></div></div></div>
<div id="settings">
  <div class="sl-modal">
    <div class="sl-modal-container">
      <div class="sl-modal-header">
        <h1>Settings</h1>
        <button id="sreset" class="sl-text-btn">Reset all</button>
        <button id="sclose" class="sl-modal-close-btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.47 2.47a.75.75 0 0 1 1.06 0L8 6.94l4.47-4.47a.75.75 0 1 1 1.06 1.06L9.06 8l4.47 4.47a.75.75 0 1 1-1.06 1.06L8 9.06l-4.47 4.47a.75.75 0 0 1-1.06-1.06L6.94 8 2.47 3.53a.75.75 0 0 1 0-1.06z"/></svg></button>
      </div>
      <div class="sl-modal-main-section"></div>
    </div>
  </div>
</div>
<script src="kawarp.js"></script>
<script src="roman.js"></script>
<script src="settings.js"></script>
<script src="api.js"></script>
<script src="spotify.js"></script>
<script src="rtc.js"></script>
<script src="anim.js"></script>
<script src="lyrics.js"></script>
<script src="app.js"></script>
</body>
</html>
