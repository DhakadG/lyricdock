<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Sizes are in vmin so one design works in all four orientations (landscape: vmin = vh, portrait: vmin = vw).
     --sa-* = camera-cutout safe insets and --bar-* = rounded-corner offsets, both pushed from Android (app.js). */
  :root { --size: 1; --dim: .2; --as: 1; --ease: cubic-bezier(.2, .8, .2, 1); --lsize: calc(9vmin * var(--size));
    --sa-l: 0px; --sa-r: 0px; --sa-t: 0px; --sa-b: 0px; --bar-bx: 0px; --bar-by: 0px; --bar-tx: 0px; --bar-ty: 0px;
    --pad: 3.5vmin; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }

  /* ---- backgrounds */
  #bgc, #bg, #bgGrad, #dim { position: fixed; inset: 0; }
  #bgc { width: 100%; height: 100%; display: none; }
  body.bg-dynamic #bgc, body.bg-artist #bgc { display: block; }
  #bg { display: none; background: #111 center/cover; transform: scale(1.4); filter: blur(60px) saturate(1.7) brightness(.7); }
  body.bg-blur #bg { display: block; }
  #bgGrad { display: none; background: linear-gradient(135deg, var(--c1, #333), var(--c2, #181818), var(--c3, #050505));
    background-size: 300% 300%; animation: gradmove calc(18s / var(--as)) ease-in-out infinite alternate; }
  body.bg-gradient #bgGrad { display: block; }
  @keyframes gradmove { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
  #dim { background: #000; opacity: var(--dim); pointer-events: none; }
  body.bg-black #dim { opacity: 1; }

  /* ---- default split layout (the notch side gets its safe inset on top of the base padding) */
  #wrap { position: relative; display: flex; height: 100%; box-sizing: border-box; gap: 4vmin;
    padding: var(--sa-t) calc(var(--sa-r) + var(--pad)) var(--sa-b) calc(var(--sa-l) + var(--pad) + 1.5vmin); }
  #left { flex: 0 0 38%; display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 0; }
  #artbox { width: min(100%, 68vmin); }
  #art { position: relative; width: 100%; aspect-ratio: 1; border-radius: 2.2vmin; background: #222 center/cover;
    box-shadow: 0 2.5vmin 7vmin #0009; transition: transform calc(.6s / var(--as)) var(--ease), box-shadow .6s; }
  body.paused.pp-both #art, body.paused.pp-shrink #art { transform: scale(.88); box-shadow: 0 1vmin 3vmin #0006; }
  #meta { width: 100%; text-align: center; margin-top: 4vmin; min-width: 0; }
  #title, #artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #titlerow { display: flex; align-items: center; justify-content: center; gap: 1.6vmin; min-width: 0; }
  #title { font-weight: 800; font-size: 5.6vmin; min-width: 0; }
  #artist { opacity: .75; font-size: 3.7vmin; margin-top: .6vmin; }
  #heart { display: none; flex: none; width: 5.2vmin; height: 5.2vmin; border: 0; padding: 0; background: none; opacity: .75;
    transition: opacity .3s, color .3s; color: #fff; }
  #heart svg { width: 100%; height: 100%; }
  #heart .fill { opacity: 0; transition: opacity .3s; }
  #heart.on { opacity: 1; color: #1ed760; }
  #heart.on .fill { opacity: 1; }
  body.show-liked #heart { display: block; }
  #quality { display: none; margin-top: 1.2vmin; font-size: 2.1vmin; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .5; }
  body.show-quality #quality:not(:empty) { display: block; }
  #pulse { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; pointer-events: none; }
  #pulse div { width: 24vmin; height: 24vmin; border-radius: 50%; background: #0007; display: grid; place-items: center;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #pulse svg { width: 12vmin; height: 12vmin; fill: #fff; }
  #ripple { position: absolute; left: 50%; top: 50%; width: 20vmin; height: 20vmin; margin: -10vmin; border-radius: 50%;
    border: .6vmin solid #fffc; opacity: 0; pointer-events: none; }

  /* ---- lyrics (Spicy Lyrics look: NotSung .51 / Active 1 / Sung .497, gradient fill + glow on words) */
  #lyrics { flex: 1; position: relative; overflow: hidden; min-width: 0; min-height: 0;
    -webkit-mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent); }
  #lyrics.static { overflow-y: auto; -webkit-mask-image: none; }
  #lines { position: absolute; left: 0; right: 0; will-change: transform; }
  #lyrics.static #lines { position: static; padding: 12vmin 0; }
  body.scroll-smooth #lines { transition: transform calc(.75s / var(--as)) cubic-bezier(.2, .8, .2, 1); }
  body.scroll-spring #lines { transition: transform calc(.9s / var(--as)) cubic-bezier(.34, 1.45, .64, 1); }
  body.scroll-snappy #lines { transition: transform calc(.35s / var(--as)) cubic-bezier(.3, .9, .3, 1); }
  .ln { font-size: var(--lsize); font-weight: 700; line-height: 1.18; letter-spacing: -.01em; padding: 1.5vmin 0;
    opacity: .51; transform-origin: left center; transform: scale(.95);
    transition: opacity .3s, transform calc(.6s / var(--as)) var(--ease), filter .5s; }
  .ln.sung { opacity: .497; }
  .ln.on { opacity: 1; transform: scale(1); }
  body.align-center .ln { text-align: center; transform-origin: center; }
  .ln.opp { text-align: right; transform-origin: right center; }
  body.blurlines .ln[data-d="2"] { filter: blur(1.2px); }
  body.blurlines .ln[data-d="3"] { filter: blur(2.4px); }
  /* Padding + equal negative margin: background-clip:text only paints inside the box, and Devanagari /
     Gurmukhi vowel marks sit above and below it - without this they get cut off while a line is active. */
  .sy { display: inline-block; --gp: -20%; --tsr: 4px; --tso: 0%; padding: .25em .06em; margin: -.25em -.06em; }
  .ln.indic { line-height: 1.45; }
  .wg { white-space: nowrap; }
  .ln.on .sy { background-image: linear-gradient(90deg, rgba(255, 255, 255, .85) var(--gp), rgba(255, 255, 255, .5) calc(var(--gp) + 20%));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 var(--tsr) rgba(255, 255, 255, var(--tso)); }
  .bgv { font-size: .55em; opacity: .85; margin-top: .3vmin; }
  .ln.on .bgv .sy { background-image: linear-gradient(90deg, rgba(255, 255, 255, .6) var(--gp), rgba(255, 255, 255, .3) calc(var(--gp) + 20%)); }
  /* Right-to-left lines (Urdu / Arabic / Hebrew in their own script): right-aligned, the fill sweeps leftwards. */
  .ln.rtl { text-align: right; transform-origin: right center; }
  body.align-center .ln.rtl { text-align: center; transform-origin: center; }
  .ln.rtl.on .sy { background-image: linear-gradient(270deg, rgba(255, 255, 255, .85) var(--gp), rgba(255, 255, 255, .5) calc(var(--gp) + 20%)); }
  .ln.far { visibility: hidden; } /* 20+ lines away: never on screen, so don't paint it */
  #toast { position: fixed; left: 50%; bottom: calc(var(--sa-b) + 9vmin); transform: translate(-50%, 2vmin); z-index: 7; max-width: 80vw;
    padding: 1.1vmin 2.6vmin; border-radius: 5vmin; background: rgba(20, 20, 24, .82); font-size: 2.6vmin; opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s var(--ease); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* Interlude dots (Spicy's musical-line): only there while the gap is playing; anim.js drives each dot + the group. */
  .ln.dots { display: none; opacity: 1; transform: none; padding: 2vmin 0; }
  .ln.dots.on { display: block; }
  .dotGroup { display: flex; gap: calc(var(--lsize) * .22); width: max-content; transform-origin: left center; scale: 0; opacity: 0; }
  body.align-center .dotGroup, body.layout-cinema .dotGroup { margin: 0 auto; transform-origin: center; }
  .dt { --tsr: 4px; --tso: 0%; width: calc(var(--lsize) * .42); height: calc(var(--lsize) * .42); border-radius: 50%;
    background: #fff; scale: .75; opacity: .35; box-shadow: 0 0 var(--tsr) rgba(255, 255, 255, var(--tso)); }
  .ln.skel { height: calc(var(--lsize) * .8); border-radius: 1.2vmin; margin: 2.4vmin 0; opacity: 1; transform: none; padding: 0;
    background: linear-gradient(90deg, #ffffff14, #ffffff33, #ffffff14); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .ln.empty { opacity: .6; transform: none; font-size: calc(var(--lsize) * .7); }
  .credits { padding: 5vmin 0 8vmin; font-weight: 700; }
  body.align-center .credits, body.layout-cinema .credits { text-align: center; }
  .writers { font-size: calc(var(--lsize) * .45); opacity: .85; }
  .provider { font-size: calc(var(--lsize) * .32); opacity: .6; margin-top: 1vmin; }
  .provider a { color: inherit; text-decoration: underline; text-underline-offset: .15em; }

  /* ---- layouts */
  body.layout-lyrics #left { display: none; }

  body.layout-compact #wrap { flex-direction: column; gap: 1vmin; padding-top: calc(var(--sa-t) + 4vmin); }
  body.layout-compact #left { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 3vmin; }
  body.layout-compact #artbox { width: 15vmin; flex: none; }
  body.layout-compact #art { border-radius: 1.4vmin; }
  body.layout-compact #meta, body.layout-cinema #meta, body.layout-nowbar #meta { text-align: left; margin: 0; }
  body.layout-compact #titlerow, body.layout-cinema #titlerow, body.layout-nowbar #titlerow { justify-content: flex-start; }
  body.layout-compact #title { font-size: 4.2vmin; }
  body.layout-compact #artist { font-size: 3vmin; }
  body.layout-compact .ln { font-size: calc(var(--lsize) * .82); }

  body.layout-tv #left { flex-basis: 42%; }
  body.layout-tv #artbox { width: min(100%, 66vmin); }
  body.layout-tv #meta { margin-top: 3vmin; }
  body.layout-tv #title { font-size: 6.2vmin; }
  body.layout-tv .ln { font-size: calc(var(--lsize) * 1.12); }

  body.layout-cinema #wrap { --pad: 8vmin; }
  body.layout-cinema #left { position: fixed; left: calc(var(--sa-l) + 5vmin); bottom: calc(var(--sa-b) + var(--bar-by) + 4vmin);
    flex-direction: row; gap: 2vmin; z-index: 2; width: auto; max-width: 60vw; }
  body.layout-cinema #artbox { width: 10vmin; flex: none; }
  body.layout-cinema #art { border-radius: 1vmin; }
  body.layout-cinema #title { font-size: 3vmin; }
  body.layout-cinema #artist { font-size: 2.4vmin; }
  body.layout-cinema .ln { text-align: center; transform-origin: center; font-size: calc(var(--lsize) * 1.2); }

  body.layout-nowbar #wrap { padding-bottom: calc(var(--sa-b) + 14vmin); }
  body.layout-nowbar #left { position: fixed; left: 50%; bottom: calc(var(--sa-b) + var(--bar-by) + 3.5vmin); transform: translateX(-50%);
    flex-direction: row; gap: 2vmin; padding: 1.2vmin 3.2vmin 1.2vmin 1.2vmin; border-radius: 6vmin; background: #0006;
    border: 1px solid #ffffff1f; z-index: 2; width: auto; max-width: 70vw; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  body.layout-nowbar #artbox { width: 8.5vmin; flex: none; }
  body.layout-nowbar #art { border-radius: 50%; }
  body.layout-nowbar #title { font-size: 3vmin; }
  body.layout-nowbar #artist { font-size: 2.3vmin; }
  body.layout-nowbar #quality { display: none !important; }
  body.layout-nowbar.paused #art { transform: scale(.9); }
  body.layout-nowbar:not(.paused) #art { animation: spin calc(12s / var(--as)) linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- portrait: cover + title on top, lyrics below (compact/cinema/nowbar/lyrics-only keep their own shape) */
  @media (orientation: portrait) {
    body.layout-split #wrap, body.layout-tv #wrap { flex-direction: column; gap: 2vmin;
      padding: calc(var(--sa-t) + 6vmin) calc(var(--sa-r) + 6vmin) calc(var(--sa-b) + var(--bar-by) + 4vmin) calc(var(--sa-l) + 6vmin); }
    body.layout-split #left, body.layout-tv #left { flex: 0 0 auto; }
    body.layout-split #artbox { width: 62vmin; }
    body.layout-tv #artbox { width: 78vmin; }
    #meta { margin-top: 3vmin; }
    body.layout-lyrics #wrap, body.layout-cinema #wrap { padding-top: calc(var(--sa-t) + 6vmin); }
    body.layout-compact #wrap { padding-top: calc(var(--sa-t) + 7vmin); }
    #lyrics { -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 90%, transparent); }
  }

  /* ---- controls */
  #ctl { display: flex; gap: 2.5vmin; padding: 1.4vmin 3vmin; border-radius: 12vmin; background: #0000005c; border: 1px solid #ffffff24;
    backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 2vmin 6vmin #0006;
    opacity: 0; pointer-events: none; transition: opacity .35s, transform .5s var(--ease); z-index: 5; }
  #art > #ctl { position: absolute; left: 50%; bottom: 3vmin; transform: translate(-50%, 3vmin) scale(.94); }
  body > #ctl { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.9); }
  body.ui #ctl { opacity: 1; pointer-events: auto; }
  body.ui #art > #ctl { transform: translate(-50%, 0) scale(1); }
  body.ui > #ctl { transform: translate(-50%, -50%) scale(1); }
  #ctl button { width: 12vmin; height: 12vmin; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center;
    transition: transform .18s var(--ease), background .25s; }
  #ctl button:active { transform: scale(.82); background: #ffffff2a; }
  #ctl svg { width: 6.5vmin; height: 6.5vmin; fill: currentColor; }
  #ctl #pp svg { width: 8.5vmin; height: 8.5vmin; }
  #ctl { flex-wrap: wrap; justify-content: center; }
  #vol { display: none; flex-basis: 100%; margin: .4vmin 2vmin 1vmin; height: 4vmin; accent-color: #fff; }
  #ctl.has-vol #vol { display: block; }
  #gear { position: fixed; top: calc(var(--sa-t) + var(--bar-ty) + 4vmin); right: calc(var(--sa-r) + var(--bar-tx) + 4vmin);
    width: 9vmin; height: 9vmin; border-radius: 50%; border: 1px solid #ffffff24; z-index: 6;
    background: #0000005c; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: grid; place-items: center;
    opacity: 0; pointer-events: none; transform: scale(.8); transition: opacity .35s, transform .5s var(--ease); }
  #gear svg { width: 5vmin; height: 5vmin; fill: #fff; }
  body.ui #gear { opacity: 1; pointer-events: auto; transform: none; }

  /* Progress bar floats just above the edge; its ends stop where the rounded corner would cut it (flat screens:
     --bar-* are 0, so it is a classic full-width edge bar). */
  #bar { position: fixed; left: var(--bar-bx); right: var(--bar-bx); bottom: var(--bar-by); height: .9vmin; border-radius: 1vmin;
    background: #ffffff26; z-index: 4; transition: height .3s; }
  #bar::before { content: ''; position: absolute; left: 0; right: 0; top: -3vmin; bottom: -1vmin; }
  body.prog-top #bar { top: var(--bar-ty); bottom: auto; left: var(--bar-tx); right: var(--bar-tx); }
  body.prog-top #bar::before { top: -1vmin; bottom: -3vmin; }
  body.prog-off #bar { display: none; }
  body.ui #bar { height: 1.5vmin; }
  #fill { height: 100%; border-radius: inherit; background: #fff; transform-origin: left; transform: scaleX(0); box-shadow: 0 0 2vmin #fff8; }
  #times { position: fixed; left: calc(var(--bar-bx) + 2vmin); right: calc(var(--bar-bx) + 2vmin); bottom: calc(var(--bar-by) + 2.4vmin);
    display: none; justify-content: space-between; z-index: 4; font-size: 2.4vmin; font-weight: 600; opacity: .8; font-variant-numeric: tabular-nums; }
  body.times #times { display: flex; }
  body.prog-top #times { top: calc(var(--bar-ty) + 2.4vmin); bottom: auto; left: calc(var(--bar-tx) + 2vmin); right: calc(var(--bar-tx) + 2vmin); }

  #pairAsk { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: #000a;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  body.pair-ask #pairAsk { display: grid; }
  .pa-card { background: rgba(28, 28, 32, .92); border: 1px solid #ffffff24; border-radius: 16px; padding: 22px 26px; max-width: 86vw; text-align: center; }
  .pa-title { font-size: 18px; font-weight: 700; }
  .pa-sub { font-size: 13px; opacity: .65; margin-top: 6px; }
  .pa-digits { font-size: 44px; font-weight: 800; letter-spacing: .25em; margin: 14px 0 18px; font-variant-numeric: tabular-nums; }
  .pa-btns { display: flex; gap: 10px; justify-content: center; }
  .pa-btns button { border: 0; border-radius: 999px; padding: 10px 22px; font-size: 15px; font-weight: 600; background: #ffffff1a; }
  .pa-btns .pa-ok { background: #fff; color: #000; }
  #dot { position: fixed; top: calc(var(--sa-t) + 4vmin); left: 50%; transform: translateX(-50%); padding: .8vmin 2.2vmin; border-radius: 5vmin; z-index: 6;
    background: #000a; font-size: 2.6vmin; opacity: 0; transition: opacity .4s; pointer-events: none; white-space: nowrap; }
  body.stale #dot { opacity: 1; }

  /* ---- settings: Spicy Lyrics' modal (src/css/tokens.css, polyfills/generic-modal-polyfill.css,
          default.css modal animation, settings-panel.css), AGPL-3.0 - scaled up with zoom for the phone. */
  #settings {
    --color-text-primary: hsla(0, 0%, 100%, .92); --color-text-secondary: hsla(0, 0%, 100%, .6); --color-text-tertiary: hsla(0, 0%, 100%, .35);
    --hairline: rgba(255, 255, 255, .08); --hairline-strong: rgba(255, 255, 255, .14);
    --accent: rgba(255, 255, 255, .95); --accent-tint-bg: rgba(255, 255, 255, .06); --accent-tint-bg-hover: rgba(255, 255, 255, .14);
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --text-title-size: 1.1rem; --text-headline-size: .9575rem; --text-body-size: .875rem; --text-caption-size: .82rem;
    --w-semibold: 600; --w-medium: 500; --w-regular: 400; --tap-min: 36px;
    --ease-standard: cubic-bezier(.4, 0, .2, 1); --dur-fast: .15s; --modal-ease: cubic-bezier(.23, 1, .32, 1);
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background-color: rgba(0, 0, 0, 0); pointer-events: none; transition: background-color .22s var(--modal-ease);
    font-size: 16px; }
  body.settings-open #settings { background-color: rgba(0, 0, 0, .45); pointer-events: auto; }
  .sl-modal { position: relative; width: min(94vw, 900px); height: 92vh; }
  body > #settings .sl-modal { margin: var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l); }
  .sl-modal::before { content: ""; position: absolute; inset: 0; border-radius: var(--radius-lg); pointer-events: none;
    background-color: rgba(22, 22, 22, .55); -webkit-backdrop-filter: blur(40px) saturate(1.5); backdrop-filter: blur(40px) saturate(1.5);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 0 0 1px var(--hairline-strong),
      0 24px 64px -12px rgba(0, 0, 0, .45), 0 8px 16px -4px rgba(0, 0, 0, .28);
    transform: scale(.96); transition: transform .22s var(--modal-ease), background-color .22s var(--modal-ease); }
  .sl-modal-container { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; border-radius: var(--radius-lg);
    color: var(--color-text-primary); transform: scale(.96); transition: transform .22s var(--modal-ease); }
  .sl-modal-container > * { opacity: 0; transition: opacity .22s var(--modal-ease); }
  body:not(.settings-open) .sl-modal::before { background-color: rgba(22, 22, 22, 0); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
  body.settings-open .sl-modal::before, body.settings-open .sl-modal-container { transform: scale(1); }
  body.settings-open .sl-modal-container > * { opacity: 1; }
  .sl-modal-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 20px 24px 16px; border-bottom: 1px solid var(--hairline); }
  .sl-modal-header h1 { font-size: var(--text-title-size); font-weight: var(--w-semibold); letter-spacing: -.01em; margin: 0; flex: 1; }
  .sl-input { width: 100%; box-sizing: border-box; background: var(--accent-tint-bg); color: var(--color-text-primary); border: 0;
    box-shadow: inset 0 0 0 1px var(--hairline); border-radius: var(--radius-sm); padding: 7px 10px; font: inherit;
    font-size: var(--text-caption-size); outline: none; user-select: text; }
  .sl-input:focus { box-shadow: inset 0 0 0 1px var(--hairline-strong); background: var(--accent-tint-bg-hover); }
  .sl-presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
  .sl-presets .sl-input { flex: 1 1 140px; width: auto; }
  .sl-text-btn { background: var(--accent-tint-bg); box-shadow: inset 0 0 0 1px var(--hairline); border: 0; border-radius: var(--radius-sm);
    padding: 7px 12px; font-size: var(--text-caption-size); font-weight: var(--w-medium); color: var(--color-text-secondary); }
  .sl-text-btn:active { background: var(--accent-tint-bg-hover); }
  .sl-modal-header .sl-text-btn { background: var(--accent-tint-bg); box-shadow: inset 0 0 0 1px var(--hairline); border: 0; border-radius: var(--radius-sm);
    padding: 7px 12px; font-size: var(--text-caption-size); font-weight: var(--w-medium); color: var(--color-text-secondary); }
  .sl-modal-close-btn { background: transparent; border: 0; width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-pill);
    color: var(--color-text-secondary); display: flex; align-items: center; justify-content: center; transition: background-color var(--dur-fast), transform .12s; }
  .sl-modal-close-btn:active { background: var(--accent-tint-bg-hover); transform: scale(.96); }
